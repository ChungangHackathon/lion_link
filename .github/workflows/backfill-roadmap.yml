
name: Backfill Completed Issues

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Import completed issues
        uses: actions/github-script@v7
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { getOctokit } = require("@actions/github");
            const repoApi = getOctokit(process.env.REPO_TOKEN);
            const org = "ChungangHackathon";

            const data = await github.graphql(`
              query($org: String!) {
                organization(login: $org) {
                  projectsV2(first: 100, query: "lion_link") {
                    nodes {
                      id
                      title
                      start: field(name: "Actual Start") {
                        ... on ProjectV2Field { id }
                      }
                      end: field(name: "Actual End") {
                        ... on ProjectV2Field { id }
                      }
                      status: field(name: "Status") {
                        ... on ProjectV2SingleSelectField {
                          id
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `, { org });

            const project = data.organization.projectsV2.nodes
              .find(p => p.title === "@lion_link");

            if (!project?.start?.id || !project?.end?.id ||
                !project?.status?.id) {
              throw new Error("Project or fields not found");
            }

            const issues = await repoApi.paginate(
              repoApi.rest.issues.listForRepo,
              {
                ...context.repo,
                state: "closed",
                per_page: 100
              }
            );

            const done = project.status.options
              .find(o => o.name.toLowerCase() === "done");

            if (!done) throw new Error("Done status not found");

            const dateKR = (timestamp) =>
              new Intl.DateTimeFormat("en-CA", {
                timeZone: "Asia/Seoul",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
              }).format(new Date(timestamp));

            let count = 0;

            for (const issue of issues) {
              if (issue.pull_request || !issue.closed_at) continue;

              const added = await github.graphql(`
                mutation($p: ID!, $i: ID!) {
                  addProjectV2ItemById(input: {
                    projectId: $p
                    contentId: $i
                  }) {
                    item { id }
                  }
                }
              `, {
                p: project.id,
                i: issue.node_id
              });

              const item = added.addProjectV2ItemById.item.id;

              const update = async (field, value) => {
                await github.graphql(`
                  mutation(
                    $p: ID!, $i: ID!,
                    $f: ID!, $v: ProjectV2FieldValue!
                  ) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $p
                      itemId: $i
                      fieldId: $f
                      value: $v
                    }) {
                      projectV2Item { id }
                    }
                  }
                `, {
                  p: project.id,
                  i: item,
                  f: field,
                  v: value
                });
              };

              await update(project.start.id, {
                date: dateKR(issue.created_at)
              });

              await update(project.end.id, {
                date: dateKR(issue.closed_at)
              });

              await update(project.status.id, {
                singleSelectOptionId: done.id
              });

              count++;
              core.info(`Imported issue #${issue.number}`);
            }

            core.info(`Completed: ${count} issues`);
