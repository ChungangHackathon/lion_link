services:
  mysql:
    image: mysql:8.4
    container_name: lionlink-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: lionlink
      MYSQL_USER: lionlink
      MYSQL_PASSWORD: lionlink
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
