spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/lionlink?serverTimezone=Asia/Seoul&characterEncoding=UTF-8 # docker-compose.yml의 MySQL
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:lionlink} # 환경변수가 없으면 로컬 기본값 사용
    password: ${DB_PASSWORD:lionlink}
  jpa:
    hibernate:
      ddl-auto: update # 엔티티 기준으로 테이블·컬럼 추가 (기존 컬럼 변경·삭제는 하지 않음)
    open-in-view: false # DB 커넥션을 트랜잭션 범위에서만 사용
  security:
    oauth2:
      client:
        registration:
          google: # 리디렉션 URI: {서버 주소}/login/oauth2/code/google
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id} # 실제 값은 환경변수로만 주입
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret} # 절대 커밋하지 않음
            scope: openid, profile, email

app:
  auth:
    jwt-secret: ${JWT_SECRET:lionlink-local-dev-only-secret-change-me-0123456789} # 32바이트 이상. 운영은 반드시 환경변수로 주입
    frontend-url: ${FRONTEND_URL:http://localhost:3000} # 로그인 후 돌아갈 프론트 주소 (CORS 허용 주소)
    cookie-secure: ${COOKIE_SECURE:false} # HTTPS 배포에서는 true
    cookie-same-site: ${COOKIE_SAME_SITE:Lax} # 프론트·백엔드 도메인이 다르면 None (cookie-secure: true 필요)
