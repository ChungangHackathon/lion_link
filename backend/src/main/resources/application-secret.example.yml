# 로컬 시크릿 설정 예시
# 1. 이 파일을 같은 폴더에 application-secret.yml로 복사한다 (.gitignore에 등록되어 커밋되지 않음)
# 2. 실제 값을 채운다. 필요 없는 항목은 지워도 된다 (application.yml의 로컬 기본값 사용)
# 우선순위: 환경변수 > application-secret.yml > application.yml 기본값

GOOGLE_CLIENT_ID: your-client-id.apps.googleusercontent.com
GOOGLE_CLIENT_SECRET: your-client-secret # 구글 클라우드 콘솔 > API 및 서비스 > 사용자 인증 정보
JWT_SECRET: change-me-to-random-string-at-least-32-bytes # 32바이트 이상
